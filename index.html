<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f3f1ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>老街坊劈柴院订桌系统</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <section class="login-view" id="loginView">
    <div class="login-panel">
      <h1>老街坊劈柴院</h1>
      <p>订桌同步系统</p>
      <form id="loginForm" class="form-stack">
        <label>
          账号
          <input type="text" id="loginUsername" autocomplete="username" required />
        </label>
        <label>
          密码
          <input type="password" id="loginPassword" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn primary">登录</button>
      </form>
      <p class="login-error" id="loginError"></p>
    </div>
  </section>

  <div class="app-shell" id="appView" hidden>
    <header class="topbar">
      <div>
        <h1>房间订桌</h1>
        <p id="userLine">正在连接...</p>
      </div>
      <button type="button" class="icon-btn" id="logoutBtn" aria-label="退出登录">退出</button>
    </header>

    <section class="sync-strip" id="syncStrip">同步状态：准备中</section>

    <section class="filters">
      <label>
        日期
        <input type="date" id="dateInput" class="date-input" />
      </label>
      <div>
        <span class="field-label">就餐时段</span>
        <div class="segmented">
          <button type="button" class="segment active" data-slot="noon">中午</button>
          <button type="button" class="segment" data-slot="evening">晚上</button>
        </div>
      </div>
    </section>

    <section class="manager-bar" id="managerBar" hidden>
      <button type="button" class="btn small" id="usersBtn">员工</button>
      <button type="button" class="btn small" id="conflictsBtn">冲突</button>
      <button type="button" class="btn small" id="statsBtn">统计</button>
    </section>

    <main class="rooms-grid" id="roomsGrid"></main>
  </div>

  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle">操作</h2>
        <button type="button" class="icon-btn" id="modalClose" aria-label="关闭">关闭</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/db.js"></script>
  <script src="/app.js"></script>
</body>
</html>
